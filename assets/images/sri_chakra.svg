<svg viewBox="0 0 600 600" width="100%" height="100%" class="sri-chakra-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Radiant Royal Gold Metallic Gradient -->
        <linearGradient id="scGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFBEB"/>
            <stop offset="18%" stop-color="#FEF08A"/>
            <stop offset="38%" stop-color="#F59E0B"/>
            <stop offset="65%" stop-color="#D97706"/>
            <stop offset="85%" stop-color="#FDE047"/>
            <stop offset="100%" stop-color="#78350F"/>
        </linearGradient>
        <linearGradient id="scGoldShine" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FEF9C3"/>
            <stop offset="45%" stop-color="#F59E0B"/>
            <stop offset="70%" stop-color="#FDE047"/>
            <stop offset="100%" stop-color="#92400E"/>
        </linearGradient>
        <radialGradient id="scBinduGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="30%" stop-color="#FEF08A"/>
            <stop offset="60%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
        </radialGradient>
        <radialGradient id="scBackdropGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(254, 240, 138, 0.45)"/>
            <stop offset="35%" stop-color="rgba(245, 158, 11, 0.22)"/>
            <stop offset="70%" stop-color="rgba(180, 83, 9, 0.08)"/>
            <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
        </radialGradient>
        <filter id="scDropGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="scIncandescentBloom" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Background Divine Aura Glow -->
    <circle cx="300" cy="300" r="280" fill="url(#scBackdropGlow)" class="chakra-ambient-aura" />
    
